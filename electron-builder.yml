appId: com.maktaba.reader
productName: مكتبة
copyright: Maktaba © 2026

directories:
  output: release
  buildResources: build

# نبني على لينكس لويندوز — لا تجرب إعادة بناء الوحدات الأصلية هنا (ستفشل/تتلخبط)،
# نستبدلها بأنفسنا بنسخ ويندوز الرسمية عبر scripts/fix-win-native.js قبل البناء
npmRebuild: false

files:
  - out/**
  # نستبعد مخلفات البناء الضخمة من better-sqlite3 (مصادر C++ و obj و sqlite.c) —
  # لا حاجة لها وقت التشغيل: المطلوب lib/ + build/Release/*.node + package.json فقط
  - "!**/node_modules/better-sqlite3/src/**"
  - "!**/node_modules/better-sqlite3/deps/**"
  - "!**/node_modules/better-sqlite3/build/obj/**"
  - "!**/node_modules/better-sqlite3/build/node_gyp_bins/**"
  - "!**/node_modules/better-sqlite3/build/Release/test_extension.node"
  - "!**/node_modules/better-sqlite3/build/Release/obj/**"
  # @napi-rs/canvas (optionalDependency من pdfjs-dist) — تُستخدم فقط عند تشغيل pdf.js
  # داخل Node، وليس في المتصفح. نسخة لينكس فقط موجودة عندنا؛ استبعادها أأمن من
  # حزمها (لن يحمّلها أحد أصلًا، وإن حاول أحدهم فسنحصل على خطأ واضح لا صمت)
  - "!**/node_modules/@napi-rs/canvas*/**"

asarUnpack:
  - "**/*.node"

win:
  icon: build/icon.ico
  # على لينكس لا يتوفر wine لتحرير موارد exe — الأيقونة تُضبط عبر NSIS والاختصارات
  # (لتضمين الأيقونة داخل exe نفسه: ابنِ على ويندوز أو ثبّت wine ثم أزل signAndEditExecutable)
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# ملاحظة بناء على لينكس:
# 1) أزل wine من PATH إن وُجد (يستخدم wine مكسورًا)
# 2) شغّل: MAKTABA_NO_WINE=1 npx electron-builder --win
#    (يستخدم UninstallerReader بنسخة JS بدل تشغيل المثبّت تحت wine — راجع NsisTarget.js)

extraResources:
  - from: build/icon.ico
    to: icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: مكتبة
  artifactName: Maktaba-Setup-${version}.${ext}
  # خيار حذف بيانات النسخة السابقة عند التثبيت (سؤال داخل المثبّت)
  include: build/installer.nsh
  # وخيار حذف البيانات عند إزالة التطبيق (مربع اختيار في نافذة الإزالة)
  deleteAppDataOnUninstall: true

portable:
  artifactName: Maktaba-Portable-${version}.${ext}

compression: maximum
